<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天天足球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Arial Black',Arial,sans-serif;background:#1a8c1a;}
canvas{display:block;width:100%;height:100%;}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);}
.panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px 22px;width:min(92vw,380px);max-height:74vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.btn{background:#e85c28;color:#fff;border:none;padding:11px 28px;font-size:15px;font-weight:900;border-radius:22px;cursor:pointer;margin:5px 4px;letter-spacing:1px;}
.btn:active{transform:scale(.96);}
.btn-sec{background:rgba(255,255,255,.12);}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-family:inherit;outline:none;margin-bottom:10px;}
input::placeholder{color:rgba(255,255,255,.35);}
h1.title{color:#ffd700;font-size:30px;font-weight:900;text-shadow:0 2px 12px #000;margin-bottom:14px;letter-spacing:2px;}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:6px 10px;pointer-events:none;z-index:5;}
#score-wrap{position:relative;width:110px;height:48px;display:flex;align-items:center;justify-content:center;}
#score-bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;}
#score-num{position:relative;z-index:1;color:#fff;font-size:22px;font-weight:900;text-shadow:0 0 12px rgba(255,215,0,.9),0 2px 4px rgba(0,0,0,.9);letter-spacing:1px;}
#score-num.pop{animation:scorePop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes scorePop{0%{transform:scale(1)}40%{transform:scale(1.8)}100%{transform:scale(1)}}
#lives-box{display:flex;gap:3px;margin-top:4px;}
#streak-box{color:#ffd700;font-size:13px;font-weight:900;text-shadow:0 1px 6px #f80,0 1px 4px #000;min-width:32px;text-align:center;margin-top:6px;}
#level-box{color:#fff;font-size:11px;font-weight:900;margin-top:6px;background:rgba(0,0,0,.35);padding:3px 7px;border-radius:8px;}
#coin-box{color:#ffd700;font-size:12px;font-weight:900;display:flex;align-items:center;gap:3px;pointer-events:auto;cursor:pointer;margin-top:4px;text-shadow:0 1px 4px #000;}
#motiv,#info{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;text-shadow:0 2px 10px #000;z-index:20;pointer-events:none;opacity:0;white-space:nowrap;text-align:center;}
#motiv{top:28%;color:#ffd700;font-size:22px;letter-spacing:2px;}
#info{top:46%;color:rgba(100,220,255,.95);font-size:15px;font-weight:900;}
#pts-float{position:absolute;pointer-events:none;z-index:22;font-weight:900;font-size:28px;text-shadow:0 2px 12px #000;opacity:0;}
#wind-ui{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:700;z-index:5;pointer-events:none;display:none;text-shadow:0 1px 4px #000;background:rgba(0,0,0,.3);padding:2px 7px;border-radius:7px;}
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.8);font-size:10px;z-index:5;pointer-events:none;text-shadow:0 1px 4px #000;}
#coin-anim{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:19px;font-weight:900;color:#ffd700;text-shadow:0 2px 8px #000;z-index:25;pointer-events:none;opacity:0;}
#power-bar{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);width:100px;height:8px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;z-index:6;pointer-events:none;display:none;border:1px solid rgba(255,255,255,.2);}
#power-fill{height:100%;width:0%;background:linear-gradient(90deg,#4f4,#ff0,#f44);border-radius:5px;}
#goal-float{position:absolute;pointer-events:none;z-index:21;display:none;}
#goal-float img{width:min(62vw,240px);display:block;}
.skin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px;}
.skin-card{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:11px;padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .15s;}
.skin-card.owned{border-color:#4f4;}
.skin-card.active-skin{border-color:#ffd700;background:rgba(255,215,0,.08);}
.skin-card img{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 4px;}
.skin-name{color:#fff;font-size:10px;font-weight:700;line-height:1.2;}
.skin-price{color:#ffd700;font-size:10px;margin-top:2px;}
.skin-effect{color:rgba(100,220,255,.8);font-size:9px;margin-top:1px;}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;}
.lb-row:last-child{border-bottom:none;}
.lb-rank{color:#ffd700;font-weight:900;width:28px;}
.lb-name{color:#fff;flex:1;padding:0 8px;}
.lb-score{color:#7fffaa;font-weight:900;}
.lb-me{background:rgba(255,215,0,.08);border-radius:6px;}
.nav{display:flex;gap:7px;margin-bottom:12px;width:min(92vw,380px);}
.nav-tab{flex:1;padding:8px 0;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.nav-tab.active{background:#e85c28;color:#fff;}
#register-screen{z-index:50;}
#main-menu{z-index:45;}
#gameover-screen{z-index:40;}
#tutorial-overlay{position:absolute;inset:0;z-index:35;pointer-events:none;}
.tut-box{position:absolute;background:rgba(0,0,0,.82);border:2px solid #ffd700;border-radius:14px;padding:12px 16px;color:#fff;font-size:13px;font-weight:700;max-width:200px;pointer-events:auto;text-align:center;line-height:1.5;}
.tut-box .tut-title{color:#ffd700;font-size:14px;font-weight:900;margin-bottom:6px;}
.tut-arrow{position:absolute;width:0;height:0;border:10px solid transparent;}
.tut-arrow-down{border-top-color:#ffd700;bottom:-21px;left:50%;transform:translateX(-50%);}
.tut-arrow-up{border-bottom-color:#ffd700;top:-21px;left:50%;transform:translateX(-50%);}
.tut-arrow-left{border-right-color:#ffd700;left:-21px;top:50%;transform:translateY(-50%);}
.tut-btn{background:#e85c28;color:#fff;border:none;padding:7px 18px;border-radius:14px;font-size:13px;font-weight:900;cursor:pointer;margin-top:8px;font-family:inherit;}
.tut-skip{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border:none;padding:5px 12px;border-radius:10px;font-size:11px;cursor:pointer;margin-top:5px;font-family:inherit;}
.tut-highlight{position:absolute;border-radius:50%;border:3px solid #ffd700;animation:tutPulse 1s ease-in-out infinite;pointer-events:none;}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.5)}50%{box-shadow:0 0 0 10px rgba(255,215,0,0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score-wrap">
    <img id="score-bg-img" src="" alt="">
    <span id="score-num">0</span>
  </div>
  <div id="lives-box"></div>
  <div id="streak-box"></div>
  <div id="level-box">LV 1</div>
  <div id="coin-box" onclick="openMenu('shop')">🪙<span id="coin-count">0</span></div>
</div>
<div style="position:absolute;top:8px;right:10px;z-index:10;pointer-events:auto;">
  <button class="btn" style="padding:5px 12px;font-size:11px;margin:0;" onclick="openMenu('game')">☰</button>
</div>
<div id="goal-float"><img id="goal-float-img" src="" alt="GOAL"></div>
<div id="motiv"></div><div id="info"></div>
<div id="pts-float"></div>
<div id="coin-anim"></div><div id="wind-ui"></div>
<div id="hint">按住屏幕下半部拖拽瞄准，松手射击</div>
<div id="power-bar"><div id="power-fill"></div></div>

<div id="tutorial-overlay" style="display:none;"></div>

<div class="ov" id="register-screen" style="display:none;">
  <h1 class="title">⚽ 天天足球</h1>
  <div class="panel" style="text-align:center;">
    <p style="color:rgba(255,255,255,.6);font-size:13px;margin-bottom:14px;">输入昵称开始游戏</p>
    <input type="text" id="username-input" placeholder="玩家昵称（最多10字）" maxlength="10">
    <button class="btn" onclick="register()" style="width:100%;">开始游戏</button>
  </div>
</div>

<div class="ov" id="main-menu" style="display:none;">
  <h1 class="title">☰ 菜单</h1>
  <div class="nav">
    <button class="nav-tab active" data-tab="game" onclick="switchTab('game')">游戏</button>
    <button class="nav-tab" data-tab="leaderboard" onclick="switchTab('leaderboard')">排行榜</button>
    <button class="nav-tab" data-tab="shop" onclick="switchTab('shop')">足球商店</button>
  </div>
  <div id="tab-game" class="panel" style="text-align:center;">
    <p style="color:rgba(255,255,255,.5);font-size:12px;margin-bottom:4px;">玩家: <span id="mu-name" style="color:#ffd700;"></span></p>
    <p style="color:rgba(255,255,255,.5);font-size:11px;margin-bottom:12px;">最高分: <span id="mu-best" style="color:#7fffaa;"></span> | 金币: <span id="mu-coins" style="color:#ffd700;"></span></p>
    <button class="btn" onclick="resumeGame()" style="width:100%;margin-bottom:8px;">继续游戏</button>
    <button class="btn btn-sec" onclick="restartGame()" style="width:100%;">重新开始</button>
  </div>
  <div id="tab-leaderboard" class="panel" style="display:none;"><div id="lb-list"></div></div>
  <div id="tab-shop" class="panel" style="display:none;">
    <p style="color:rgba(255,255,255,.5);font-size:11px;margin-bottom:8px;">金币: <span id="shop-coins" style="color:#ffd700;font-weight:900;"></span> 🪙</p>
    <div id="shop-balls" class="skin-grid"></div>
  </div>
</div>

<div class="ov" id="gameover-screen" style="display:none;">
  <h1 class="title">GAME OVER</h1>
  <div class="panel" style="text-align:center;">
    <p style="color:rgba(255,255,255,.6);font-size:13px;">最终得分</p>
    <div style="color:#ffd700;font-size:36px;font-weight:900;margin:8px 0;" id="go-score">0</div>
    <p style="color:rgba(255,255,255,.5);font-size:11px;margin-bottom:14px;">本局金币: <span id="go-coins" style="color:#ffd700;font-weight:900;">0</span> 🪙</p>
    <button class="btn" onclick="restartGame()" style="width:100%;margin-bottom:8px;">再来一局</button>
    <button class="btn btn-sec" onclick="viewLB()" style="width:100%;">查看排行榜</button>
  </div>
</div>

<script>
// ═══════ IMAGES ═══════
const IMG_SRC={
  bg:"踢球样式/bj.png",
  goalImg:"踢球样式/goal.png",
  robotIdle:"踢球样式/keeper_idle.png",
  robotDive:"踢球样式/keeper_dive.png",
  robotAngry:"踢球样式/keeper_angry.png",
  robotDizzy:"踢球样式/keeper_dizzy.png",
  goalToast:"踢球样式/goal_toast.png",
  scoreBox:"踢球样式/score_box.png",
  ball_classic:"踢球样式/ball_classic.png",
  ball_fire:"skin/ball_fire.png",
  ball_ice:"skin/ball_ice.png",
  ball_lightning:"skin/ball_lightning.png",
  ball_rainbow:"skin/ball_rainbow.png",
  ball_gem:"skin/ball_gem.png",
  foot:"踢球样式/foot.png",
  rockImg:"踢球样式/rock.png",
  bottleImg:"踢球样式/bottle.png",
  teammateImg:"踢球样式/teammate.png"
};
const IMGS={};
function loadImages(cb){
  let done=0,total=Object.keys(IMG_SRC).length;
  for(const [k,src] of Object.entries(IMG_SRC)){
    const img=new Image();
    img.onload=()=>{IMGS[k]=img;if(++done===total)cb();};
    img.onerror=()=>{console.warn('img fail',k);if(++done===total)cb();};
    img.src=src;
  }
}

// ═══════ DATA ═══════
const LS={
  get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let player=LS.get('ttfb_player');
let lb=LS.get('ttfb_lb')||[];
const savePlayer=()=>LS.set('ttfb_player',player);
const saveLB=()=>LS.set('ttfb_lb',lb);
function updateLB(name,score){
  const i=lb.findIndex(e=>e.name===name);
  if(i>=0){if(score>lb[i].score)lb[i].score=score;}else lb.push({name,score});
  lb.sort((a,b)=>b.score-a.score);if(lb.length>20)lb=lb.slice(0,20);saveLB();
}

// ═══════ 足球皮肤 ═══════
const BALL_SKINS=[
  {id:'classic',name:'经典白球',price:0,effect:'无特殊技能',skill:'',imgKey:'ball_classic'},
  {id:'fire',name:'火焰足球',price:5,effect:'🔥弹射得分×弹射次数',skill:'fire',imgKey:'ball_fire'},
  {id:'ice',name:'冰霜足球',price:5,effect:'❄️碰到墙壁有几率生成一个冰墙',skill:'ice',imgKey:'ball_ice'},
  {id:'lightning',name:'闪电足球',price:10,effect:'⚡弹射减速守门 5次宕机 每3-4发⚡道具×3',skill:'lightning',imgKey:'ball_lightning'},
  {id:'rainbow',name:'彩虹足球',price:30,effect:'🌈0.5s后同角度追加幽灵球 穿透守门员正常得分',skill:'rainbow',imgKey:'ball_rainbow'},
  {id:'gem',name:'宝石足球',price:80,effect:'💎弹射后地图随机出现宝石，碰到宝石后增大进球概率',skill:'gem',imgKey:'ball_gem'},
];

// ═══════ 菜单 ═══════
function register(){
  const inp=document.getElementById('username-input'),name=inp.value.trim();
  if(!name){inp.style.borderColor='#f44';return;}
  player={name,bestScore:0,coins:0,ownedBalls:['classic'],activeBall:'classic'};
  savePlayer();hide('register-screen');initGame();
  // 新用户显示教程
  setTimeout(()=>startTutorial(),600);
}

// ═══════ 新手教程 ═══════
let tutStep=0;
const TUT_STEPS=[
  {
    html:'<div class="tut-title">⚽ 欢迎来到天天足球！</div>按住屏幕<b>下半部</b>，向后拖拽瞄准方向，<b>松手</b>即可射门！',
    pos:'center',next:'明白了！'
  },
  {
    html:'<div class="tut-title">🪨 石头障碍</div>球碰到<b>石头</b>会弹向球门方向！弹射进球得分 <b>×10</b>！',
    pos:'top',next:'下一步'
  },
  {
    html:'<div class="tut-title">🍾 加倍道具</div>场上发光的<b>塑料瓶</b>是道具！球碰到后立即消失，本次进球得分 <b>×3</b>！每5-6回合出现一次！',
    pos:'top',next:'下一步'
  },
  {
    html:'<div class="tut-title">🔥 连击加分</div>连续进球可获得<b>连击加成</b>！墙壁反弹次数越多，得分越高！',
    pos:'center',next:'开始游戏！'
  }
];
function startTutorial(){
  if(LS.get('ttfb_tut_done'))return;
  tutStep=0;showTutStep();
}
function showTutStep(){
  const overlay=document.getElementById('tutorial-overlay');
  if(tutStep>=TUT_STEPS.length){endTutorial();return;}
  const step=TUT_STEPS[tutStep];
  overlay.style.display='block';
  overlay.innerHTML='';
  // 半透明遮罩（仅顶部，不遮挡游戏区）
  const mask=document.createElement('div');
  mask.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,0.55);';
  overlay.appendChild(mask);
  // 提示框
  const box=document.createElement('div');
  box.className='tut-box';
  box.innerHTML=step.html;
  const btn=document.createElement('button');
  btn.className='tut-btn';btn.textContent=step.next;
  btn.onclick=()=>{tutStep++;showTutStep();};
  box.appendChild(document.createElement('br'));
  box.appendChild(btn);
  // 跳过按钮（最后一步不显示）
  if(tutStep<TUT_STEPS.length-1){
    const skip=document.createElement('button');
    skip.className='tut-skip';skip.textContent='跳过教程';
    skip.onclick=endTutorial;
    box.appendChild(document.createElement('br'));
    box.appendChild(skip);
  }
  // 定位
  if(step.pos==='center'){
    box.style.cssText='left:50%;top:50%;transform:translate(-50%,-50%);max-width:260px;';
  } else if(step.pos==='top'){
    box.style.cssText='left:50%;top:32%;transform:translateX(-50%);max-width:260px;';
  }
  overlay.appendChild(box);
}
function endTutorial(){
  document.getElementById('tutorial-overlay').style.display='none';
  LS.set('ttfb_tut_done',true);
}
document.getElementById('username-input').onkeydown=e=>{if(e.key==='Enter')register();};
function openMenu(tab){pauseGame();if(player){document.getElementById('mu-name').textContent=player.name;document.getElementById('mu-best').textContent=player.bestScore;document.getElementById('mu-coins').textContent=player.coins;}show('main-menu');switchTab(tab||'game');}
function viewLB(){hide('gameover-screen');openMenu('leaderboard');}
function switchTab(tab){
  ['game','leaderboard','shop'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===tab?'block':'none';
    document.querySelector(`.nav-tab[data-tab="${t}"]`).classList.toggle('active',t===tab);
  });
  if(tab==='leaderboard')renderLB();
  if(tab==='shop')renderBallShop();
}
function renderBallShop(){
  document.getElementById('shop-coins').textContent=player?.coins||0;
  const grid=document.getElementById('shop-balls');grid.innerHTML='';
  BALL_SKINS.forEach(skin=>{
    const owned=player?.ownedBalls.includes(skin.id),active=player?.activeBall===skin.id;
    const card=document.createElement('div');card.className='skin-card'+(owned?' owned':'')+(active?' active-skin':'');
    const img=IMGS[skin.imgKey];const imgEl=document.createElement('img');imgEl.src=img?img.src:'';imgEl.alt=skin.name;card.appendChild(imgEl);
    card.innerHTML+=`<div class="skin-name">${skin.name}</div><div class="skin-effect">${skin.effect}</div><div class="skin-price">${active?'✓使用中':owned?'已拥有':skin.price===0?'免费':'🪙'+skin.price}</div>`;
    card.onclick=()=>{
      if(!player||active)return;
      if(owned){player.activeBall=skin.id;savePlayer();renderBallShop();return;}
      if(player.coins>=skin.price){player.coins-=skin.price;player.ownedBalls.push(skin.id);player.activeBall=skin.id;savePlayer();document.getElementById('coin-count').textContent=player.coins;renderBallShop();}
      else flash('金币不足！','#f66');
    };
    grid.appendChild(card);
  });
}
function renderLB(){const el=document.getElementById('lb-list');el.innerHTML=!lb.length?'<p style="color:rgba(255,255,255,.4);text-align:center;font-size:13px;padding:20px 0;">暂无记录</p>':lb.map((e,i)=>`<div class="lb-row ${player&&e.name===player.name?'lb-me':''}"><span class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><span class="lb-name">${e.name}</span><span class="lb-score">${e.score}</span></div>`).join('');}
function resumeGame(){hide('main-menu');gameActive=true;}
function restartGame(){hide('main-menu');hide('gameover-screen');initGame();}
const show=id=>document.getElementById(id).style.display='flex';
const hide=id=>document.getElementById(id).style.display='none';

// ═══════ 游戏引擎 ═══════
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,gameActive=false,gamePaused=false;
let score=0,streak=0,level=1,lives=5,bounceCount=0,coinsThisGame=0,shotCount=0;
let state='idle',wind=0,goalX=0,goalY=0,goalW=200,goalH=110,goalDirX=1,goalVx=0,goalMoving=false;
let obstacles=[],particles=[],ballTrail=[],shakeAmt=0,shX=0,shY=0;
let keeperEmotion='idle',keeperEmotionT=0;
// 脚部动画状态
let footAlpha=0,footAngle=0,footPwr=0,legCharging=false,lastShotLeft=false;
let rockBounced=false; // 是否经过石头弹射
let ballSpeedMult=1.0; // 保留兼容
let bottleTriple=false; // 本回合是否碰到塑料瓶（得分×3）
let nextBottleShot=0; // 下次出现塑料瓶的回合
// ── 技能状态 ──
let iceWalls=[]; // 冰霜足球：冰墙列表 {x,y,w,h,life(回合数)}
let iceBouncedThisShot=false; // 本次射击是否碰到冰墙
let lightningSlowMult=1.0; // 闪电足球：守门员速度减缓倍率
let lightningBounceCount=0; // 闪电：当次弹射计数（触发减速）
let lightningCrashed=false; // 闪电：守门员宕机
let rainbowBall2=null; // 彩虹：第二球状态
let gemCoinSpawned=false; // 宝石：金币是否已生成
let bottleUsedThisGame=false; // 保留兼容（不再用）
let lightningPickupUsed=false; // 保留兼容（不再用）
let nextLightningPickupShot=0; // 闪电道具下次出现的回合（每3-4发）

const WALL=14,POST=7,POST_H=8,POWER=1.65,MAX_DRAG=90;
const ball={x:0,y:0,vx:0,vy:0,r:16,active:false,spin:0};
const drag={on:false,x:0,y:0};
const sling={x:0,y:0};
const keeper={x:0,y:0,w:82,h:96,diving:false,diveDir:0,diveT:0,patrolDir:1,speed:0,phase:'patrol'};
let coinScoreAccum=0; // 每50分获得1金币

function pauseGame(){gamePaused=true;gameActive=false;}
function resize(){W=cv.width=cv.offsetWidth;H=cv.height=cv.offsetHeight;}
function initGame(){
  resize();
  score=0;streak=0;level=1;lives=5;bounceCount=0;coinsThisGame=0;coinScoreAccum=0;shotCount=0;
  gameActive=true;gamePaused=false;state='idle';
  obstacles=[];particles=[];ballTrail=[];shakeAmt=0;shX=0;shY=0;goalDirX=1;
  keeperEmotion='idle';keeperEmotionT=0;footAlpha=0;legCharging=false;footPwr=0;lastShotLeft=false;teammate=null;
  ballSpeedMult=1.0;
  nextBottleShot=4+Math.floor(Math.random()*3);    // 水瓶：4-6发后首次出现
  nextLightningPickupShot=2+Math.floor(Math.random()*2); // 闪电：2-3发后首次出现
  iceWalls=[];iceBouncedThisShot=false;lightningSlowMult=1.0;lightningBounceCount=0;lightningCrashed=false;
  rainbowBall2=null;gemCoinSpawned=false;bottleUsedThisGame=false;lightningPickupUsed=false;
  goalW=Math.min(W*.62,270);goalH=Math.min(H*.26,155);
  goalX=W*.5-goalW/2;goalY=H*.06;
  sling.x=W*.5;sling.y=H*.80;
  document.getElementById('hint').style.opacity='1';
  document.getElementById('power-bar').style.display='none';
  document.getElementById('score-num').textContent='0';
  document.getElementById('goal-float').style.display='none';
  if(IMGS.scoreBox) document.getElementById('score-bg-img').src=IMGS.scoreBox.src;
  if(IMGS.goalToast) document.getElementById('goal-float-img').src=IMGS.goalToast.src;
  updateHUD();resetBall();resetKeeper();applyLevel();
  // 初始障碍物由resetBall→spawnObstacles生成
}
function resetBall(){
  ball.x=sling.x;ball.y=sling.y;
  ball.vx=0;ball.vy=0;ball.active=false;ball.spin=0;
  ballTrail=[];bounceCount=0;
  if(state!=='gameover')state='idle';
  drag.on=false;footAlpha=0;legCharging=false;footPwr=0;rockBounced=false;bottleTriple=false;
  iceBouncedThisShot=false;lightningBounceCount=0;rainbowBall2=null;
  // gemCoinSpawned 不在此重置，金币保留到被击中
  // 激活上一回合留下的 pending 冰墙
  iceWalls.forEach(iw=>{if(iw.pending)iw.pending=false;});
  sling.x=W*.5;sling.y=H*.80;
  ball.x=sling.x;ball.y=sling.y;
  document.getElementById('power-bar').style.display='none';
  wind=level>=3?(Math.random()-.5)*.003*(level-1.5):0;
  updateWindUI();
  // 发球前预生成障碍物（每次重置球时重新生成）
  spawnObstacles();
}
function resetKeeper(){
  keeper.x=goalX+goalW/2-keeper.w/2;keeper.y=goalY+goalH-keeper.h;
  keeper.diving=false;keeper.diveDir=0;keeper.diveT=0;
  keeper.patrolDir=Math.random()>.5?1:-1;keeper.speed=1.2+level*.4;keeper.phase='patrol';
  lightningCrashed=false;lightningSlowMult=1.0;lightningBounceCount=0;
}
function applyLevel(){
  goalMoving=level>=2;goalVx=level>=2?Math.min(.40+(level-2)*.25,2.2):0;
  keeper.speed=1.2+level*.4;
  // 障碍物由spawnObstacles负责，此处只设移动参数
}
function spawnObstacles(){
  // 每次发球前重新生成障碍物，冰墙和金币跨回合保留
  // 先保存还没被击中的金币
  const survivingGemCoin=obstacles.find(o=>o.type==='gemcoin'&&!o.hit)||null;
  const survivingLightningPickup=obstacles.find(o=>o.type==='lightningpickup'&&!o.hit)||null;
  obstacles=[];
  if(level>=4){
    const n=Math.min(level-3,5),safe={x:sling.x-90,y:sling.y-170,w:180,h:170};
    let tries=0;
    while(obstacles.length<n&&tries++<200){
      const ox=W*(.18+Math.random()*.64),oy=H*(.32+Math.random()*.28);
      const sz=26+Math.random()*20;
      if(ox>safe.x&&ox<safe.x+safe.w&&oy>safe.y&&oy<safe.y+safe.h)continue;
      if(oy<goalY+goalH+50)continue;
      obstacles.push({x:ox,y:oy,w:sz,h:sz,type:'rock',
        ang:Math.random()*Math.PI,glowT:0,vx:0,vy:0,hit:false});
    }
  }
  // 宝石足球：恢复未被击中的金币，或者（进球有弹射后）生成新金币
  if((player?.activeBall||'classic')==='gem'){
    if(survivingGemCoin){
      obstacles.push(survivingGemCoin); // 还没被碰到的金币保留
    } else if(!gemCoinSpawned&&shotCount>0){
      spawnGemCoin(); // 上轮进球有弹射，生成新金币
    }
  }
  // 恢复未被拾取的闪电道具
  if(survivingLightningPickup)obstacles.push(survivingLightningPickup);
  // 塑料瓶：每4-6发出一个（场上最多同时1个）
  const bottleOnField=obstacles.some(o=>o.type==='bottle'&&o.isPowerup&&!o.hit);
  if(!bottleOnField && shotCount>=nextBottleShot){
    spawnBottlePowerup();
    nextBottleShot=shotCount+4+Math.floor(Math.random()*3); // 下次：再过4-6发
  }
  // 闪电道具：仅限闪电足球，每3-4发出一个（场上最多同时1个）
  if((player?.activeBall||'classic')==='lightning'){
    const lightningOnField=obstacles.some(o=>o.type==='lightningpickup'&&!o.hit);
    if(!lightningOnField && shotCount>=nextLightningPickupShot){
      spawnLightningPickup();
      nextLightningPickupShot=shotCount+2+Math.floor(Math.random()*2); // 下次：再过2-3发
    }
  }
  // 冰墙：跨回合保留，只有已激活的冰墙才减寿
  iceWalls=iceWalls.filter(w=>w.life>0);
  iceWalls.forEach(w=>{if(!w.pending)w.life--;});
}
function spawnBottlePowerup(){
  const safe={x:sling.x-90,y:sling.y-170,w:180,h:170};
  let tries=0,ox,oy;
  do{
    ox=W*(.15+Math.random()*.7);
    oy=H*(.28+Math.random()*.38);
    tries++;
  }while(tries<100&&((ox>safe.x&&ox<safe.x+safe.w&&oy>safe.y&&oy<safe.y+safe.h)||oy<goalY+goalH+50));
  const sz=30+Math.random()*14;
  obstacles.push({x:ox,y:oy,w:sz,h:sz,type:'bottle',
    ang:Math.random()*Math.PI*2,glowT:0.6,vx:0,vy:0,hit:false,isPowerup:true});
}
function spawnGemCoin(){
  // 宝石足球：生成必进金币（功能同石头，但弹射后必定朝向球门）
  if(gemCoinSpawned)return;
  gemCoinSpawned=true;
  const safe={x:sling.x-90,y:sling.y-170,w:180,h:170};
  let tries=0,ox,oy;
  do{
    ox=W*(.18+Math.random()*.64);
    oy=H*(.30+Math.random()*.30);
    tries++;
  }while(tries<100&&((ox>safe.x&&ox<safe.x+safe.w&&oy>safe.y&&oy<safe.y+safe.h)||oy<goalY+goalH+40));
  const sz=28+Math.random()*14;
  obstacles.push({x:ox,y:oy,w:sz,h:sz,type:'gemcoin',
    ang:0,glowT:1,vx:0,vy:0,hit:false});
  flash('💎 宝石出现，大大增加进球概率！','#ffd700');
}
function spawnLightningPickup(){
  // 闪电道具：与水瓶效果相同（得分×3），随机位置
  const safe={x:sling.x-90,y:sling.y-170,w:180,h:170};
  let tries=0,ox,oy;
  do{
    ox=W*(.12+Math.random()*.76);
    oy=H*(.22+Math.random()*.50);
    tries++;
  }while(tries<100&&((ox>safe.x&&ox<safe.x+safe.w&&oy>safe.y&&oy<safe.y+safe.h)||oy<goalY+goalH+40));
  const sz=28+Math.random()*10;
  obstacles.push({x:ox,y:oy,w:sz,h:sz,type:'lightningpickup',
    ang:0,glowT:1,vx:0,vy:0,hit:false});
  flash('⚡ 闪电道具出现！触碰得分×3！','#ffe566');
}

// 队友系统
let teammate=null;
function spawnTeammate(){
  if(teammate)return;
  // 随机位置，避开球和弹弓
  let tx,ty,tries=0;
  do{
    tx=W*(.1+Math.random()*.8);
    ty=H*(.35+Math.random()*.45);
    tries++;
  }while(tries<100&&Math.hypot(tx-sling.x,ty-sling.y)<120);
  teammate={x:tx,y:ty,w:55,h:80,hasball:false,shootT:0,active:true};
  flash('队友出现！传球给他！','#7fffaa');
}
function checkTeammateSpawn(){
  if(lives===1&&!teammate&&state!=='gameover'){spawnTeammate();}
}
function updateHUD(){
  document.getElementById('score-num').textContent=score;
  document.getElementById('coin-count').textContent=player?.coins||0;
  document.getElementById('level-box').textContent='LV '+level+'  📌'+shotCount+'发';
  renderHearts();
}
function renderHearts(){
  const el=document.getElementById('lives-box');el.innerHTML='';
  for(let i=0;i<5;i++){
    const hc=document.createElement('canvas');hc.width=18;hc.height=16;
    const hx=hc.getContext('2d'),s=5.5,cx2=9,cy=8.5;
    hx.fillStyle=i<lives?'#ff4455':'#3a2222';
    hx.beginPath();hx.moveTo(cx2,cy+s*.3);hx.bezierCurveTo(cx2,cy-s*.5,cx2-s,cy-s*.5,cx2-s,cy+s*.2);hx.bezierCurveTo(cx2-s,cy+s*.7,cx2,cy+s*1.1,cx2,cy+s*1.1);hx.bezierCurveTo(cx2,cy+s*1.1,cx2+s,cy+s*.7,cx2+s,cy+s*.2);hx.bezierCurveTo(cx2+s,cy-s*.5,cx2,cy-s*.5,cx2,cy+s*.3);
    hx.fill();el.appendChild(hc);
  }
}
function updateWindUI(){
  const el=document.getElementById('wind-ui');
  if(level>=3&&Math.abs(wind)>.0008){el.style.display='block';el.textContent='风 '+(wind>0?'→':'←')+' '+(Math.abs(wind)<.0018?'微风':Math.abs(wind)<.0028?'中风':'强风');}
  else el.style.display='none';
}
function checkCoins(){while(score-coinScoreAccum>=50){coinScoreAccum+=50;awardCoin();}}
function awardCoin(){
  if(!player)return;player.coins++;coinsThisGame++;savePlayer();
  document.getElementById('coin-count').textContent=player.coins;
  const el=document.getElementById('coin-anim');
  el.textContent='+1 🪙';el.style.cssText='position:absolute;left:50%;top:24%;transform:translateX(-50%) translateY(0);font-size:19px;font-weight:900;color:#ffd700;text-shadow:0 2px 8px #000;z-index:25;pointer-events:none;opacity:1;transition:none;';
  setTimeout(()=>{el.style.transition='opacity .8s,transform .8s';el.style.opacity='0';el.style.transform='translateX(-50%) translateY(-36px)';},150);
}
function flash(txt,col){
  const el=document.getElementById('info');el.textContent=txt;el.style.color=col||'rgba(100,220,255,.95)';
  el.style.opacity='1';el.style.transition='none';
  clearTimeout(el._t);el._t=setTimeout(()=>{el.style.transition='opacity .8s';el.style.opacity='0';},1300);
}
function motiv(txt){
  const el=document.getElementById('motiv');el.textContent=txt;
  el.style.cssText='opacity:1;transform:translateX(-50%) scale(1.1);transition:none;';
  setTimeout(()=>{el.style.cssText='opacity:0;transform:translateX(-50%) translateY(-28px);transition:opacity .6s,transform .6s;';},1100);
}
function showPtsFloat(bx,by,pts,bounces,rock,bottle){
  const el=document.getElementById('pts-float');
  const r=cv.getBoundingClientRect();
  const col=bottle?'#44ffff':rock?'#ff8800':pts>=32?'#ff44ff':pts>=8?'#ffd700':'#7fffaa';
  const sz=pts>=32?52:pts>=8?40:30;
  let label='';
  if(bottle)label+='🍾<span style="color:#44ffff;font-size:20px;">×3</span>  ';
  if(rock)label+='🪨';
  if(bounces>0)label+='<span style="color:'+col+'">弹射×'+bounces+'</span>  ';
  label+='<span style="font-size:'+sz+'px;color:'+col+'">'+pts+'</span>';
  el.innerHTML=label;
  el.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height*0.38}px;transform:translate(-50%,-50%) scale(0.4);opacity:1;transition:none;text-shadow:0 2px 14px #000,0 0 30px ${col};font-weight:900;white-space:nowrap;`;
  requestAnimationFrame(()=>{
    el.style.transition='transform .35s cubic-bezier(.34,1.56,.64,1),opacity .5s .6s';
    el.style.transform='translate(-50%,-50%) scale(1)';
    setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,-120%) scale(1.05)';},800);

}
function showGoalImg(bx,by){
  if(!IMGS.goalToast)return;
  const el=document.getElementById('goal-float'),r=cv.getBoundingClientRect();
  el.style.cssText=`position:absolute;pointer-events:none;z-index:21;left:${r.left+bx}px;top:${r.top+by}px;transform:translate(-50%,-100%) scale(0);transition:none;opacity:1;display:block;`;
  requestAnimationFrame(()=>{el.style.transition='transform .25s cubic-bezier(.34,1.56,.64,1)';el.style.transform='translate(-50%,-100%) scale(1)';setTimeout(()=>{el.style.transition='transform .5s,opacity .5s';el.style.transform='translate(-50%,-160%) scale(1.05)';el.style.opacity='0';setTimeout(()=>{el.style.display='none';},600);},950);});
}
const STREAK_MSG={2:['双响炮！'],3:['帽子戏法！'],4:['4连击！'],5:['封神！'],7:['开挂了！'],10:['球王！']};
const TRICK_MSG=['弹射大师！','物理学家！','精妙弧线！','完美反弹！'];
function showStreakMotiv(s){const keys=Object.keys(STREAK_MSG).map(Number).filter(k=>k<=s).sort((a,b)=>b-a);if(!keys.length)return;motiv(STREAK_MSG[keys[0]][0]);}
function setKeeperEmotion(e,dur){keeperEmotion=e;keeperEmotionT=dur;}
function onGoal(){
  const skin=player?.activeBall||'classic';
  const bonus=Math.min(bounceCount,6);
  let pts;
  if(rockBounced){
    pts=Math.pow(2,Math.min(bounceCount,5))*10;
    pts=Math.min(pts,999);
  } else {
    pts=Math.pow(2,Math.min(bounceCount,5));
    pts=Math.min(pts,64);
  }
  // 🔥 火焰足球：每弹射一次得分×2（连乘，弹N次 = ×2^N）
  if(skin==='fire'&&bounceCount>0){
    pts=Math.min(pts*Math.pow(2,bounceCount),9999);
    flash('🔥 火焰连击！×'+Math.pow(2,bounceCount),'#ff6600');
  }
  // ❄️ 冰霜足球：从冰墙弹射后得分×3
  if(skin==='ice'&&iceBouncedThisShot){pts=Math.min(pts*3,9999);}
  // 🍾 塑料瓶道具：得分×3
  if(bottleTriple){pts=Math.min(pts*3,9999);}
  score+=pts;streak++;state='scored';shakeAmt=18+Math.min(bonus,4)*4;
  addStars(ball.x,ball.y);
  addBurst(ball.x,ball.y,'#ffd700',30+bonus*5,6+bonus);
  if(pts>=10)addBurst(ball.x,ball.y,'#ff6600',20,8);
  if(pts>=32)addBurst(ball.x,ball.y,'#ff44ff',15,10);
  const sn=document.getElementById('score-num');
  sn.textContent=score;sn.classList.remove('pop');void sn.offsetWidth;sn.classList.add('pop');
  showGoalImg(ball.x,ball.y);
  showPtsFloat(ball.x,ball.y,pts,bounceCount,rockBounced,bottleTriple||(skin==='ice'&&iceBouncedThisShot));
  if(streak>=2){const sk=document.getElementById('streak-box');sk.textContent='🔥x'+streak;sk.style.transform='scale(1.6)';setTimeout(()=>{sk.style.cssText='transform:scale(1);transition:transform .2s;';},300);setTimeout(()=>showStreakMotiv(streak),420);}
  if(player){checkCoins();if(score>player.bestScore){player.bestScore=score;savePlayer();}}
  setKeeperEmotion(bonus>0?'dizzy':'angry',2000);
  // 宝石足球：只要有弹射进球，下一发球时生成金币
  if((player?.activeBall||'classic')==='gem'&&bounceCount>0){
    gemCoinSpawned=false; // 允许下一发球生成金币
  }
  setTimeout(()=>{resetBall();resetKeeper();},1600);
}
function onMiss(){
  if(state==='miss'||state==='scored'||state==='gameover'||state==='teammate')return;
  streak=0;document.getElementById('streak-box').textContent='';
  state='miss';lives--;addBurst(ball.x,ball.y,'#ff4455',12,3);
  renderHearts();shakeAmt=10;
  if(lives<=0)setTimeout(onGameOver,950);
  else{flash('MISS!','#ff6666');checkTeammateSpawn();setTimeout(()=>{resetBall();resetKeeper();},950);}
}
function onKeeperSave(){setKeeperEmotion('angry',1800);onMiss();}
function onGameOver(){
  state='gameover';gameActive=false;
  if(player){updateLB(player.name,score);savePlayer();}
  document.getElementById('go-score').textContent=score;document.getElementById('go-coins').textContent=coinsThisGame;
  show('gameover-screen');
}

// ── 输入处理 ──
function clientPos(cx2,cy2){const r=cv.getBoundingClientRect();return{x:cx2-r.left,y:cy2-r.top};}
function inputDown(clientX,clientY){
  if(!gameActive||state!=='idle')return;
  const p=clientPos(clientX,clientY);
  if(p.y>H*.42){
    drag.on=true;drag.x=p.x;drag.y=p.y;state='dragging';legCharging=true;
    document.getElementById('hint').style.opacity='0';
    document.getElementById('power-bar').style.display='block';
  }
}
function inputMove(clientX,clientY){
  if(!drag.on)return;
  const p=clientPos(clientX,clientY);drag.x=p.x;drag.y=p.y;
  const d=Math.hypot(drag.x-sling.x,drag.y-sling.y);
  if(d>MAX_DRAG){const r=(drag.x-sling.x)/d,ri=(drag.y-sling.y)/d;drag.x=sling.x+r*MAX_DRAG;drag.y=sling.y+ri*MAX_DRAG;}
  footPwr=Math.min(Math.hypot(drag.x-sling.x,drag.y-sling.y)/MAX_DRAG,1);
  document.getElementById('power-fill').style.width=(footPwr*100)+'%';
}
function inputUp(){
  if(!drag.on||state!=='dragging')return;
  drag.on=false;document.getElementById('power-bar').style.display='none';legCharging=false;
  const dx=sling.x-drag.x,dy=sling.y-drag.y,pwr=Math.hypot(dx,dy)/MAX_DRAG;
  if(pwr<.06){state='idle';footPwr=0;return;}
  ball.vx=dx/MAX_DRAG*pwr*21*POWER*ballSpeedMult;ball.vy=dy/MAX_DRAG*pwr*21*POWER*ballSpeedMult;
  ball.active=true;ball.spin=ball.vx*.22;state='flying';keeper.phase='tracking';
  // 🌈 彩虹足球：0.3秒后同角度同速度射出第二球
  if((player?.activeBall||'classic')==='rainbow'){
    const vx2=ball.vx,vy2=ball.vy;
    const sx2=sling.x,sy2=sling.y;
    setTimeout(()=>{
      if(state==='flying'||state==='scored'||state==='miss')
        rainbowBall2={x:sx2,y:sy2,vx:vx2,vy:vy2,spin:0,active:true,trail:[]};
    },300);
  }
  // 队友持球时继承之前的弹射次数，否则重置
  if(teammate&&teammate.active&&teammate.hasball){
    bounceCount=teammate.savedBounce||0;
    rockBounced=teammate.savedRock||false;
  } else {
    bounceCount=0;
  }
  footAngle=Math.atan2(ball.vy,ball.vx);
  lastShotLeft=(sling.x-drag.x)>0;
  footAlpha=1.0;footPwr=0;
  shotCount++;
  const newLevel=Math.floor(shotCount/3)+1;
  if(newLevel>level){level=newLevel;const lb=document.getElementById('level-box');lb.textContent='LV '+level+'  📌'+shotCount+'发';lb.style.color=level>=6?'#ff6b6b':level>=4?'#ffd700':'#7fffaa';applyLevel();motiv('🔥 LV'+level+' 升级！');}
  setTimeout(()=>{
    if(state==='flying'){
      const bx=ball.x+ball.vx*6,dir=bx>keeper.x+keeper.w/2?1:-1;
      if(Math.random()<Math.min(.25+level*.07,.82)){keeper.diving=true;keeper.diveDir=dir;keeper.diveT=0;setKeeperEmotion('dive',800);}
    }
  },90);
}
cv.addEventListener('mousedown',e=>{e.preventDefault();inputDown(e.clientX,e.clientY);});
cv.addEventListener('mousemove',e=>{e.preventDefault();inputMove(e.clientX,e.clientY);});
cv.addEventListener('mouseup',e=>{e.preventDefault();inputUp();});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length>0)inputDown(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length>0)inputMove(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();inputUp();},{passive:false});
cv.addEventListener('touchcancel',e=>{e.preventDefault();drag.on=false;if(state==='dragging')state='idle';legCharging=false;footPwr=0;document.getElementById('power-bar').style.display='none';},{passive:false});

// ── 碰撞 ──
function circRect(bx,by,br,rx,ry,rw,rh){const nx=Math.max(rx,Math.min(bx,rx+rw)),ny=Math.max(ry,Math.min(by,ry+rh)),dx=bx-nx,dy=by-ny;return dx*dx+dy*dy<br*br;}
function reflect(rx,ry,rw,rh,rest){
  rest=rest||.75;const nx=Math.max(rx,Math.min(ball.x,rx+rw)),ny=Math.max(ry,Math.min(ball.y,ry+rh));
  const dx=ball.x-nx,dy=ball.y-ny,d=Math.sqrt(dx*dx+dy*dy)||1,nx2=dx/d,ny2=dy/d,dot=ball.vx*nx2+ball.vy*ny2;
  ball.vx=(ball.vx-2*dot*nx2)*rest;ball.vy=(ball.vy-2*dot*ny2)*rest;
  ball.x=nx+nx2*(ball.r+2);ball.y=ny+ny2*(ball.r+2);
}
function checkPosts(){
  const posts=[{rx:goalX-POST,ry:goalY,rw:POST*2,rh:goalH},{rx:goalX+goalW-POST,ry:goalY,rw:POST*2,rh:goalH},{rx:goalX-POST,ry:goalY-POST_H,rw:goalW+POST*2,rh:POST_H*2}];
  for(const r of posts){if(circRect(ball.x,ball.y,ball.r,r.rx,r.ry,r.rw,r.rh)){reflect(r.rx,r.ry,r.rw,r.rh,.62);addBurst(ball.x,ball.y,'#fff',4,2);shakeAmt=3;return true;}}return false;
}
function insideNet(){return ball.x>goalX+POST&&ball.x<goalX+goalW-POST&&ball.y>goalY+POST_H&&ball.y<goalY+goalH;}
function addBurst(x,y,col,n,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.5+Math.random()*.5);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:3+Math.random()*6,col,g:.07+Math.random()*.04});}}
function addStars(x,y){for(let i=0;i<18;i++){const a=i/18*Math.PI*2;particles.push({x,y,vx:Math.cos(a)*(2.5+Math.random()*5),vy:Math.sin(a)*(2.5+Math.random()*5),life:1,size:5+Math.random()*8,col:['#ffd700','#fff700','#ffaa00','#fff'][i%4],g:.04,star:true});}}
function wallSpark(x,y,dir){for(let i=0;i<7;i++){const a=(Math.random()-.5)*Math.PI*.8;particles.push({x,y,vx:Math.cos(a)*(2+Math.random()*3)*dir,vy:(Math.random()-.5)*(2+Math.random()*3),life:1,size:2+Math.random()*4,col:['#88ddff','#44aaff','#fff'][i%3],g:.04});}}
function keeperHitbox(){
  if(keeper.diving){const t=keeper.diveT;return{x:keeper.x+keeper.diveDir*t*75-22,y:keeper.y-Math.sin(t*Math.PI)*22,w:keeper.w+44,h:keeper.h};}
  return{x:keeper.x,y:keeper.y,w:keeper.w,h:keeper.h};
}
function updateKeeper(dt){
  if(keeperEmotionT>0){keeperEmotionT-=dt;if(keeperEmotionT<=0){keeperEmotion='idle';keeperEmotionT=0;}}
  if(lightningCrashed)return; // 宕机：守门员停止
  if(keeper.diving){keeper.diveT=Math.min(keeper.diveT+dt*.003,1);if(keeper.diveT>=1){keeper.diving=false;keeper.phase='patrol';}return;}
  const L=goalX+6,R=goalX+goalW-keeper.w-6;
  const spd=keeper.speed*lightningSlowMult;
  if(state==='flying'&&keeper.phase==='tracking'){const tgt=Math.max(L,Math.min(R,ball.x-keeper.w/2)),diff=tgt-keeper.x;keeper.x+=Math.sign(diff)*Math.min(spd*dt*.13,Math.abs(diff));}
  else{keeper.x+=keeper.patrolDir*spd*dt*.055;if(keeper.x<=L){keeper.x=L;keeper.patrolDir=1;}if(keeper.x>=R){keeper.x=R;keeper.patrolDir=-1;}}
  keeper.x=Math.max(L,Math.min(R,keeper.x));keeper.y=goalY+goalH-keeper.h;
}
function update(dt){
  if(!gameActive||gamePaused)return;
  if(shakeAmt>0){shakeAmt-=dt*.1;shX=(Math.random()-.5)*shakeAmt;shY=(Math.random()-.5)*shakeAmt;if(shakeAmt<0){shakeAmt=0;shX=shY=0;}}
  if(goalMoving&&state!=='scored'){goalX+=goalVx*goalDirX*dt*.055;if(goalX<W*.04){goalX=W*.04;goalDirX=1;}if(goalX+goalW>W*.96){goalX=W*.96-goalW;goalDirX=-1;}}
  if(footAlpha>0)footAlpha=Math.max(0,footAlpha-dt*.005);

  const activeSkin=player?.activeBall||'classic';

  // ── 彩虹足球：第二球物理更新 ──
  if(rainbowBall2&&rainbowBall2.active){
    rainbowBall2.vy+=.32;rainbowBall2.vx+=wind*dt;
    rainbowBall2.x+=rainbowBall2.vx;rainbowBall2.y+=rainbowBall2.vy;
    rainbowBall2.spin+=rainbowBall2.vx*.04;
    // 彩虹轨迹
    if(!rainbowBall2.trail)rainbowBall2.trail=[];
    if(rainbowBall2.trail.length>20)rainbowBall2.trail.shift();
    rainbowBall2.trail.push({x:rainbowBall2.x,y:rainbowBall2.y});
    if(rainbowBall2.x-ball.r<=WALL){rainbowBall2.x=WALL+ball.r;rainbowBall2.vx=Math.abs(rainbowBall2.vx)*.86;}
    if(rainbowBall2.x+ball.r>=W-WALL){rainbowBall2.x=W-WALL-ball.r;rainbowBall2.vx=-Math.abs(rainbowBall2.vx)*.86;}
    if(rainbowBall2.y>H+60||rainbowBall2.y+ball.r<0){rainbowBall2.active=false;}
    // 第二球：可被守门员拦截，正常计分
    if(insideNet2(rainbowBall2)){
      rainbowBall2.active=false;
      const kh=keeperHitbox();
      if(!lightningCrashed&&circRect(rainbowBall2.x,rainbowBall2.y,ball.r,kh.x,kh.y,kh.w,kh.h)){
        addBurst(rainbowBall2.x,rainbowBall2.y,'#ff4455',10,4);
        flash('🌈 幽灵球被拦截！','#ff8888');
      } else {
        const skin2=player?.activeBall||'classic';
        let pts2;
        if(rockBounced){pts2=Math.min(Math.pow(2,Math.min(bounceCount,5))*10,999);}
        else{pts2=Math.min(Math.pow(2,Math.min(bounceCount,5)),64);}
        if(skin2==='fire'&&bounceCount>0)pts2=Math.min(pts2*Math.pow(2,bounceCount),9999);
        if(skin2==='ice'&&iceBouncedThisShot)pts2=Math.min(pts2*3,9999);
        if(bottleTriple)pts2=Math.min(pts2*3,9999);
        score+=pts2;streak++;
        const sn=document.getElementById('score-num');sn.textContent=score;
        sn.classList.remove('pop');void sn.offsetWidth;sn.classList.add('pop');
        addStars(rainbowBall2.x,rainbowBall2.y);
        addBurst(rainbowBall2.x,rainbowBall2.y,'#ff88ff',24,7);
        addBurst(rainbowBall2.x,rainbowBall2.y,'#ffd700',12,5);
        showPtsFloat(rainbowBall2.x,rainbowBall2.y,pts2,bounceCount,rockBounced,bottleTriple);
        if(player){checkCoins();if(score>player.bestScore){player.bestScore=score;savePlayer();}}
        motiv('🌈 幽灵球进网！');
      }
    }
  }

  if(ball.active&&(state==='flying'||state==='teammate_shot')){state='flying';
    ball.vy+=.32;ball.vx+=wind*dt;ball.x+=ball.vx;ball.y+=ball.vy;ball.spin+=ball.vx*.04;
    if(ballTrail.length>16)ballTrail.shift();ballTrail.push({x:ball.x,y:ball.y,spd:Math.hypot(ball.vx,ball.vy)});

    // ── 墙壁碰撞 ──
    if(ball.x-ball.r<=WALL){
      ball.x=WALL+ball.r;ball.vx=Math.abs(ball.vx)*.86;ball.spin*=-.5;
      wallSpark(WALL+ball.r,ball.y,1);shakeAmt=3;bounceCount++;
      flash('墙壁反弹！','rgba(100,220,255,.95)');
      onWallBounce(ball.x,ball.y); // 冰球：标记冰墙
      checkIceWallBonus(true,ball.y); // 冰球：检查此墙有无冰墙加成
      onBounce();
    }
    if(ball.x+ball.r>=W-WALL){
      ball.x=W-WALL-ball.r;ball.vx=-Math.abs(ball.vx)*.86;ball.spin*=-.5;
      wallSpark(W-WALL-ball.r,ball.y,-1);shakeAmt=3;bounceCount++;
      onWallBounce(ball.x,ball.y);
      checkIceWallBonus(false,ball.y);
      onBounce();
    }

    if(ball.y+ball.r<0){onMiss();return;}
    if(ball.y<goalY+goalH+ball.r*2)checkPosts();
    if(insideNet()){
      const kh=keeperHitbox();
      if(!lightningCrashed&&circRect(ball.x,ball.y,ball.r,kh.x,kh.y,kh.w,kh.h)){
        ball.vx=-ball.vx*.4;ball.vy=-Math.abs(ball.vy)*.3;onKeeperSave();
      } else {
        onGoal();
      }
      return;
    }

    // ── 障碍物碰撞 ──
    for(const o of (obstacles||[])){
      if(o.hit)continue;
      if(!circRect(ball.x,ball.y,ball.r,o.x-o.w/2,o.y-o.h/2,o.w,o.h))continue;

      if(o.type==='rock'){
        const spd=Math.hypot(ball.vx,ball.vy);
        const upBias=-Math.PI/2+((Math.random()-.5)*Math.PI*.8);
        ball.vx=Math.cos(upBias)*spd*.9;ball.vy=Math.sin(upBias)*spd*.9;
        o.glowT=1;bounceCount++;
        addBurst(ball.x,ball.y,'#aaa',10,4);addBurst(ball.x,ball.y,'#fff',4,5);
        shakeAmt=6;rockBounced=true;flash('岩石弹射！x10！','#ff8800');
        o.hit=true;
        onBounce();
      } else if(o.type==='gemcoin'){
        // 宝石金币：朝球门方向弹射
        const spd=Math.hypot(ball.vx,ball.vy);
        const goalCenterX=goalX+goalW/2;
        const ang=Math.atan2(goalY+goalH/2-ball.y, goalCenterX-ball.x);
        const spread=(Math.random()-.5)*0.3;
        ball.vx=Math.cos(ang+spread)*spd*.95;ball.vy=Math.sin(ang+spread)*spd*.95;
        o.glowT=1;bounceCount++;rockBounced=true;
        addBurst(ball.x,ball.y,'#ffd700',14,5);addBurst(ball.x,ball.y,'#fff',6,6);
        shakeAmt=7;flash('💎 金币弹射！必进！','#ffd700');motiv('💎 黄金一击！');
        o.hit=true;onBounce();
      } else if(o.type==='lightningpickup'){
        // 闪电道具：效果与水瓶相同，得分×3，立即消失
        o.hit=true;bottleTriple=true;
        addBurst(ball.x,ball.y,'#ffe566',16,5);addBurst(ball.x,ball.y,'#ffffff',8,7);addBurst(ball.x,ball.y,'#ffff00',12,6);
        shakeAmt=5;flash('⚡ 闪电道具！得分 ×3！','#ffe566');motiv('⚡ ×3 加倍！');
        bounceCount++;onBounce();
      } else if(o.type==='bottle'&&o.isPowerup){
        o.hit=true;bottleTriple=true;
        addBurst(ball.x,ball.y,'#44aaff',16,5);addBurst(ball.x,ball.y,'#ffffff',8,7);addBurst(ball.x,ball.y,'#ffd700',12,6);
        shakeAmt=5;flash('🍾 塑料瓶！得分 ×3！','#44ffff');motiv('🍾 ×3 加倍！');
        bounceCount++;onBounce();
      }
    }

    // 检查传给队友
    if(teammate&&teammate.active&&!teammate.hasball){
      if(circRect(ball.x,ball.y,ball.r,teammate.x-teammate.w/2,teammate.y-teammate.h*.8,teammate.w,teammate.h)){
        teammate.hasball=true;teammate.savedBounce=bounceCount;teammate.savedRock=rockBounced;
        ball.active=false;ball.vx=0;ball.vy=0;
        sling.x=teammate.x;sling.y=teammate.y-teammate.h*.3;
        ball.x=sling.x;ball.y=sling.y;state='idle';
        flash('队友接球！拖拽继续射门！','#7fffaa');
      }
    }
    if(ball.y>H+60)onMiss();
  }
  updateKeeper(dt);
  // 被打飞的瓶子（兼容旧逻辑，已无普通瓶，保留安全）
  for(const o of (obstacles||[])){
    if(o.glowT>0)o.glowT=Math.max(0,o.glowT-dt*.003);
  }
  if(teammate&&teammate.active&&teammate.hasball&&state==='flying'){
    teammate.hasball=false;teammate.active=false;teammate=null;
  }
  checkTeammateSpawn();
  for(let i=(particles||[]).length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.96;p.life-=.022;if(p.life<=0)particles.splice(i,1);}
}

// ── 碰撞发生后的技能响应 ──
function onBounce(){
  const skin=player?.activeBall||'classic';
  // 闪电足球：每次弹射减缓守门员
  if(skin==='lightning'){
    lightningBounceCount++;
    if(lightningBounceCount>=5&&!lightningCrashed){
      lightningCrashed=true;setKeeperEmotion('dizzy',99999);
      flash('⚡ 守门员宕机！','#ffe566');motiv('⚡ 系统崩溃！');
    } else if(lightningBounceCount<5){
      lightningSlowMult=Math.max(0.05,1.0-lightningBounceCount*0.2);
      flash('⚡ 守门员减速！×'+lightningBounceCount,'#ffe566');
    }
  }
}
// 撞墙回调（冰霜生成冰墙标记）- 本次撞墙留下冰墙视觉标记，下一发球才生效
function onWallBounce(wx,wy){
  if((player?.activeBall||'classic')!=='ice')return;
  if(state!=='flying')return;
  const wallH=ball.r*2*1.5; // 冰墙视觉长度（竖向）= 球直径×1.5
  // 检查是否已有近处冰墙
  for(const iw of iceWalls){if(Math.abs(iw.y-wy)<wallH*0.8)return;}
  const isLeftWall=(wx<=WALL+ball.r+4);
  // x 紧贴对应墙壁边界，w 设为 0（不参与碰撞，仅视觉）
  const wallX=isLeftWall?WALL:W-WALL;
  iceWalls.push({x:wallX,y:wy-wallH/2,w:0,h:wallH,isLeft:isLeftWall,life:4,pending:true});
  addBurst(wx,wy,'#aaffff',10,3);flash('❄️ 冰墙已标记！下次发球有效','#aaffff');
}
// 球撞墙时检查该墙是否有冰墙标记（×3加成）
function checkIceWallBonus(isLeft,ballY){
  if((player?.activeBall||'classic')!=='ice')return;
  for(const iw of iceWalls){
    if(iw.pending)continue;
    if(iw.isLeft!==isLeft)continue; // 只匹配同侧墙
    if(ballY>=iw.y&&ballY<=iw.y+iw.h){
      if(!iceBouncedThisShot){
        iceBouncedThisShot=true;
        addBurst(isLeft?WALL+ball.r:W-WALL-ball.r,ballY,'#aaffff',14,4);
        flash('❄️ 冰墙加成！×3！','#aaffff');
      }
      break;
    }
  }
}
function insideNet2(b2){return b2.x>goalX+POST&&b2.x<goalX+goalW-POST&&b2.y>goalY+POST_H&&b2.y<goalY+goalH;}

// ── 绘制 ──
function drawBG(){
  if(IMGS.bg)ctx.drawImage(IMGS.bg,0,0,W,H);
  else{ctx.fillStyle='#2d8a2d';ctx.fillRect(0,0,W,H);}
}
function drawGoal(){
  if(IMGS.goalImg){const iw=IMGS.goalImg.naturalWidth||200,ih=IMGS.goalImg.naturalHeight||130;ctx.drawImage(IMGS.goalImg,goalX,goalY,goalW,goalW*(ih/iw));}
  else{ctx.strokeStyle='#fff';ctx.lineWidth=POST*2;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(goalX,goalY+goalH);ctx.lineTo(goalX,goalY);ctx.lineTo(goalX+goalW,goalY);ctx.lineTo(goalX+goalW,goalY+goalH);ctx.stroke();}
}
function drawKeeper(){
  let img=lightningCrashed&&IMGS.robotDizzy?IMGS.robotDizzy:keeperEmotion==='dizzy'&&IMGS.robotDizzy?IMGS.robotDizzy:keeperEmotion==='angry'&&IMGS.robotAngry?IMGS.robotAngry:(keeper.diving||keeperEmotion==='dive')&&IMGS.robotDive?IMGS.robotDive:IMGS.robotIdle||null;
  if(!img)return;
  ctx.save();
  if(lightningCrashed){
    // 宕机：闪烁+蓝色滤镜
    const flicker=Math.sin(Date.now()*.03)>.2;
    ctx.globalAlpha=flicker?.7:.4;
    ctx.filter='hue-rotate(180deg) brightness(1.5)';
  }
  if(keeper.diving){ctx.translate(keeper.x+keeper.w/2,keeper.y+keeper.h/2);ctx.rotate(keeper.diveDir*keeper.diveT*0.4);ctx.drawImage(img,-keeper.w/2,-keeper.h/2,keeper.w,keeper.h);}
  else ctx.drawImage(img,keeper.x,keeper.y,keeper.w,keeper.h);
  if(lightningCrashed){
    ctx.filter='none';
    ctx.globalAlpha=1;
    ctx.fillStyle='#ffe566';ctx.font='bold 16px Arial';ctx.textAlign='center';
    ctx.fillText('⚡💀⚡',keeper.x+keeper.w/2,keeper.y-8);
  }
  ctx.restore();
}
function drawObstacles(){
  if(!obstacles)return;
  // 先画冰墙（视觉标记，紧贴侧墙）
  for(const iw of iceWalls){
    if(iw.life<=0)continue;
    const alpha=iw.pending?0.3:Math.min(1,iw.life/4)*0.9;
    const wallH=iw.h;
    const cx=iw.isLeft?(WALL+4):(W-WALL-4); // 冰柱中心X，紧贴墙面
    const icicleW=8+ball.r*0.4; // 冰柱宽度（向场内突出）
    const x0=iw.isLeft?WALL:(W-WALL-icicleW);
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.shadowColor='#00ffff';ctx.shadowBlur=iw.pending?4:12;
    // 冰柱主体
    const grad=ctx.createLinearGradient(x0,iw.y,x0+icicleW,iw.y);
    grad.addColorStop(0,iw.isLeft?'#aaffff':'rgba(170,255,255,0.1)');
    grad.addColorStop(1,iw.isLeft?'rgba(170,255,255,0.1)':'#aaffff');
    ctx.fillStyle=iw.pending?'rgba(136,204,204,0.4)':grad;
    if(iw.pending)ctx.setLineDash([4,4]);
    ctx.fillRect(x0,iw.y,icicleW,wallH);
    ctx.setLineDash([]);
    // 边框
    ctx.strokeStyle='rgba(200,255,255,0.6)';ctx.lineWidth=1.5;
    ctx.strokeRect(x0,iw.y,icicleW,wallH);
    ctx.shadowBlur=0;
    // 剩余回合数（非pending）
    if(!iw.pending){
      ctx.fillStyle='#003366';ctx.font='bold 9px Arial';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(iw.life,x0+icicleW/2,iw.y+wallH/2);
    }
    ctx.restore();
  }
  for(const o of obstacles){
    if(o.hit)continue;
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.ang);
    const sz=o.w;
    if(o.type==='rock'&&IMGS.rockImg){
      ctx.globalAlpha=1;ctx.drawImage(IMGS.rockImg,-sz/2,-sz/2,sz,sz);
    } else if(o.type==='bottle'&&IMGS.bottleImg){
      ctx.globalAlpha=1;ctx.drawImage(IMGS.bottleImg,-sz*0.75,-sz*0.45,sz*1.5,sz*0.9);
    } else if(o.type==='lightningpickup'){
      // 闪电道具：黄色放射光晕
      ctx.globalAlpha=1;
      const pulse=Math.sin(Date.now()*.008)*.4+.6;
      ctx.shadowColor='#ffe566';ctx.shadowBlur=20+pulse*12;
      ctx.fillStyle='#ffe566';ctx.beginPath();ctx.arc(0,0,sz/2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ff8800';ctx.lineWidth=3;ctx.stroke();
      ctx.shadowBlur=0;ctx.font=`bold ${Math.round(sz*.7)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('⚡',0,2);
    } else if(o.type==='gemcoin'){
      // 金币：金色发光圆形
      ctx.globalAlpha=1;
      const pulse=Math.sin(Date.now()*.006)*.3+.7;
      ctx.shadowColor='#ffd700';ctx.shadowBlur=18+pulse*10;
      ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(0,0,sz/2,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#ffaa00';ctx.lineWidth=3;ctx.stroke();
      ctx.shadowBlur=0;ctx.fillStyle='#7a5500';ctx.font=`bold ${Math.round(sz*.55)}px Arial`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💎',0,1);
    } else {
      if(o.type==='rock'){ctx.fillStyle='#7a7a7a';ctx.beginPath();ctx.ellipse(0,0,sz/2,sz/2,0,0,Math.PI*2);ctx.fill();}
      else{ctx.fillStyle=o.isPowerup?'#44ffff':'#44aaff';ctx.fillRect(-sz/2,-sz/3,sz,sz*.65);}
    }
    ctx.restore();
    // 塑料瓶道具：闪烁光晕和🍾图标
    if(o.type==='bottle'&&o.isPowerup&&!o.hit){
      const pulse=Math.sin(Date.now()*.005)*.5+.5;
      ctx.save();
      ctx.globalAlpha=0.25+pulse*0.35;ctx.strokeStyle='#00ffff';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(o.x,o.y,o.w*0.85+pulse*4,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=0.7+pulse*0.3;
      ctx.font=`bold ${Math.round(o.w*0.7)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#00ffff';ctx.shadowColor='#00ffff';ctx.shadowBlur=10;
      ctx.fillText('🍾',o.x,o.y-o.h*0.6);ctx.restore();
    }
    // 闪电道具：脉冲外圈
    if(o.type==='lightningpickup'&&!o.hit){
      const pulse=Math.sin(Date.now()*.007)*.5+.5;
      ctx.save();
      ctx.globalAlpha=0.3+pulse*0.4;ctx.strokeStyle='#ffe566';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(o.x,o.y,o.w*0.85+pulse*5,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
  }
}

function drawTeammate(){
  if(!teammate||!teammate.active)return;
  const img=IMGS.teammateImg;
  const tx=teammate.x, ty=teammate.y;
  // 队友闪烁提示
  const blink=Math.sin(Date.now()*.008)*.3+.7;
  ctx.save();
  ctx.globalAlpha=blink;
  if(img){
    ctx.drawImage(img,tx-teammate.w/2,ty-teammate.h,teammate.w,teammate.h);
  } else {
    ctx.fillStyle='#3399ff';
    ctx.fillRect(tx-teammate.w/2,ty-teammate.h,teammate.w,teammate.h);
  }
  // 队友头顶箭头提示
  ctx.globalAlpha=blink;
  ctx.fillStyle='#7fffaa';
  ctx.beginPath();
  ctx.moveTo(tx,ty-teammate.h-18);
  ctx.lineTo(tx-10,ty-teammate.h-5);
  ctx.lineTo(tx+10,ty-teammate.h-5);
  ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawBall(){
  const activeId=player?.activeBall||'classic';
  const trailColors={classic:'200,200,200',fire:'255,100,0',ice:'100,200,255',lightning:'180,100,255',rainbow:'255,200,0',gem:'255,210,80'};
  const tc=trailColors[activeId]||'200,200,200';
  for(let i=0;i<ballTrail.length;i++){
    const t=i/ballTrail.length,spd=Math.min((ballTrail[i].spd||10)/35,1);
    ctx.beginPath();ctx.arc(ballTrail[i].x,ballTrail[i].y,ball.r*t*.45,0,Math.PI*2);
    ctx.fillStyle=`rgba(${tc},${t*.18*spd})`;ctx.fill();
  }
  const img=IMGS['ball_'+activeId]||IMGS.ball_classic||null;
  if(img){ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.spin);ctx.drawImage(img,-ball.r,-ball.r,ball.r*2,ball.r*2);ctx.restore();}
  else{ctx.save();ctx.translate(ball.x,ball.y);ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.restore();}
  // 🌈 彩虹：绘制第二球（更醒目：彩虹轨迹 + 大光晕 + 标签）
  if(rainbowBall2&&rainbowBall2.active){
    const r2=ball.r*1.2; // 第二球比原球稍大
    // 彩虹轨迹
    const RAINBOW_COLS=['#ff0044','#ff8800','#ffee00','#44ff44','#00aaff','#aa44ff'];
    if(rainbowBall2.trail){
      for(let i=0;i<rainbowBall2.trail.length;i++){
        const t=i/rainbowBall2.trail.length;
        const col=RAINBOW_COLS[i%RAINBOW_COLS.length];
        ctx.save();ctx.globalAlpha=t*0.55;
        ctx.beginPath();ctx.arc(rainbowBall2.trail[i].x,rainbowBall2.trail[i].y,r2*t*0.6,0,Math.PI*2);
        ctx.fillStyle=col;ctx.fill();ctx.restore();
      }
    }
    // 球体本身
    ctx.save();
    ctx.globalAlpha=0.92;
    ctx.shadowColor='#ff88ff';ctx.shadowBlur=22;
    ctx.translate(rainbowBall2.x,rainbowBall2.y);ctx.rotate(rainbowBall2.spin);
    const img2=IMGS['ball_rainbow']||IMGS.ball_classic||null;
    if(img2)ctx.drawImage(img2,-r2,-r2,r2*2,r2*2);
    else{ctx.beginPath();ctx.arc(0,0,r2,0,Math.PI*2);ctx.fillStyle='#ff88ff';ctx.fill();}
    ctx.restore();
    // 彩虹光环（旋转）
    const hueAngle=(Date.now()*0.003)%(Math.PI*2);
    ctx.save();ctx.globalAlpha=0.5;
    const grad=ctx.createConicalGradient?null:null; // fallback arc rings
    for(let i=0;i<6;i++){
      const a=hueAngle+i/6*Math.PI*2;
      ctx.strokeStyle=RAINBOW_COLS[i];ctx.lineWidth=2.5;ctx.globalAlpha=0.4;
      ctx.beginPath();ctx.arc(rainbowBall2.x,rainbowBall2.y,r2+5+i*1.5,a,a+Math.PI/3);ctx.stroke();
    }
    ctx.restore();
    // 标签
    ctx.save();ctx.globalAlpha=0.9;
    ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillStyle='#ff88ff';ctx.shadowColor='#000';ctx.shadowBlur=4;
    ctx.fillText('幽灵球',rainbowBall2.x,rainbowBall2.y-r2-4);
    ctx.restore();
  }
}
// ── 脚部绘制 ──
// 图片：453x352，脚趾朝左下，小腿在右上
// 原图 = 射向左（脚在球右侧）
// 射向右 = 水平翻转（脚在球左侧）
// 锚点 = 小腿中部（固定不动），脚向前挥动

function drawLeg(){
  const footImg=IMGS.foot;
  if(!footImg)return;

  const natW=footImg.naturalWidth||453, natH=footImg.naturalHeight||352;
  const targetW=ball.r*7;
  const targetH=targetW*(natH/natW);

  // 小腿锚点在图片的 (右侧72%, 上方18%) 处
  // 即：从图片左边 72% 处、从图片顶部 18% 处
  const ankX=0.5; // 小腿在图片水平方向的位置
  const ankY=0.2; // 小腿在图片垂直方向的位置

  if(state==='dragging'&&legCharging){
    const pwr=footPwr;
    const shootingLeft=(sling.x-drag.x)>0;

    // 蓄力时以球为中轴线，两侧镜像对称画两只脚
    const maxSwing = 0.85;
    const swingAngle = pwr * maxSwing * (shootingLeft ? 1 : -1);

    // 主脚：在球的拖拽反方向一侧
    const sideDir = shootingLeft ? 1 : -1;
    const mainAnkX = sling.x + sideDir * ball.r * -2.2;
    const mainAnkY = sling.y + ball.r * -0.7;
    const flipMain = shootingLeft;

    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.translate(mainAnkX, mainAnkY);
    ctx.rotate(swingAngle);
    if(flipMain) ctx.scale(-1, 1);
    ctx.drawImage(footImg, -targetW * ankX, -targetH * ankY, targetW, targetH);
    ctx.restore();

    // 镜像脚：球另一侧，位置、角度、翻转全部镜像
    const mirrorAnkX = 2 * sling.x - mainAnkX;
    const mirrorAnkY = mainAnkY;
    const mirrorAngle = -swingAngle;
    const flipMirror = !flipMain;

    ctx.save();
    ctx.globalAlpha = 0;
    ctx.translate(mirrorAnkX, mirrorAnkY);
    ctx.rotate(mirrorAngle);
    if(flipMirror) ctx.scale(-1, 1);
    ctx.drawImage(footImg, -targetW * ankX, -targetH * ankY, targetW, targetH);
    ctx.restore();


  } else if(footAlpha>0){
    // 踢出动画：小腿固定，脚向前挥动
    // 小腿位置保持在踢球时的位置（sling旁）
    const swingT = 1 - footAlpha; // 0→1 随时间推进
    const shootingLeft = lastShotLeft;
    const flipX = shootingLeft; // 脚在球下方，镜像调转
    const sideDir = shootingLeft ? 1 : -1;

    // 小腿锚点固定（踢球瞬间的位置）
    const ankX_world = sling.x + sideDir * ball.r * 2.2;
    const ankY_world = sling.y + ball.r * 0.7;

    // 脚从后摆 → 向前挥出：角度从后摆到前摆
    const maxSwing = 0.85;
    const forwardSwing = 0.5; // 前挥角度
    // 从满蓄力角度挥向前方
    const angle = (maxSwing - swingT * (maxSwing + forwardSwing)) * (shootingLeft ? 1 : -1);

    ctx.save();
    ctx.globalAlpha = footAlpha * 0.9;
    ctx.translate(ankX_world, ankY_world);
    ctx.rotate(angle);
    if(flipX) ctx.scale(-1, 1);
    ctx.drawImage(footImg,
      -targetW * ankX, -targetH * ankY,
      targetW, targetH);
    ctx.restore();

  } else if(state==='idle'){
    // 静止：原图方向（射左），脚在球右侧，自然放置
    const shootingLeft = true; // 默认原图方向
    const flipX = true; // 脚在球下方，镜像调转
    const ankX_world = sling.x + ball.r * 4.0;
    const ankY_world = sling.y + ball.r * -0.3;

    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.translate(ankX_world, ankY_world);
    ctx.rotate(0.05);
    ctx.drawImage(footImg,
      -targetW * ankX, -targetH * ankY,
      targetW, targetH);
    ctx.restore();
  }
}
function drawDragGuide(){
  if(state!=='dragging')return;
  const dx=sling.x-drag.x,dy=sling.y-drag.y,pwr=Math.hypot(dx,dy)/MAX_DRAG;
  if(pwr<.06)return;
  const vx0=dx/MAX_DRAG*pwr*21*POWER,vy0=dy/MAX_DRAG*pwr*21*POWER;
  ctx.save();ctx.setLineDash([5,9]);ctx.strokeStyle='rgba(255,255,150,.28)';ctx.lineWidth=1.8;
  ctx.beginPath();let px=sling.x,py=sling.y,pvx=vx0,pvy=vy0;ctx.moveTo(px,py);
  for(let i=0;i<28;i++){pvy+=.32;px+=pvx;py+=pvy;if(px-ball.r<=WALL){px=WALL+ball.r;pvx=Math.abs(pvx)*.86;}if(px+ball.r>=W-WALL){px=W-WALL-ball.r;pvx=-Math.abs(pvx)*.86;}if(py>H)break;ctx.lineTo(px,py);}
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
}
function drawParticles(){
  for(const p of (particles||[])){
    ctx.save();ctx.globalAlpha=p.life;
    if(p.star){ctx.fillStyle=p.col;ctx.beginPath();for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2,r=i%2===0?p.size:p.size*.38;i?ctx.lineTo(Math.cos(a)*r+p.x,Math.sin(a)*r+p.y):ctx.moveTo(Math.cos(a)*r+p.x,Math.sin(a)*r+p.y);}ctx.closePath();ctx.fill();}
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fillStyle=p.col;ctx.fill();}
    ctx.restore();
  }
}
function drawWalls(){
  ctx.fillStyle='rgba(100,180,255,.04)';ctx.fillRect(0,0,WALL,H);ctx.fillRect(W-WALL,0,WALL,H);
  ctx.strokeStyle='rgba(100,180,255,.14)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(WALL,0);ctx.lineTo(WALL,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W-WALL,0);ctx.lineTo(W-WALL,H);ctx.stroke();
}
function drawWind(){
  if(level<3||Math.abs(wind)<=.0008)return;
  const str=Math.abs(wind)*240,wx=W/2,wy=H*.72-18,dir=Math.sign(wind);
  ctx.save();ctx.globalAlpha=.45;ctx.strokeStyle='#9bccff';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(wx-str,wy);ctx.lineTo(wx+str,wy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(wx+str*dir,wy);ctx.lineTo(wx+str*dir-dir*8,wy-6);ctx.moveTo(wx+str*dir,wy);ctx.lineTo(wx+str*dir-dir*8,wy+6);ctx.stroke();ctx.restore();
}

let lastT=0;
function loop(t){
  const dt=Math.min(t-lastT,50);lastT=t;
  update(dt);
  ctx.save();ctx.translate(shX,shY);
  drawBG();drawWalls();drawGoal();drawObstacles();
  drawTeammate();
  drawLeg();
  if(ball.y<goalY+goalH)drawBall();
  drawKeeper();
  if(ball.y>=goalY+goalH)drawBall();
  drawDragGuide();drawParticles();drawWind();
  ctx.restore();
  requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize',()=>resize());
requestAnimationFrame(loop);

// ── BGM ──
const bgm=new Audio('bgm.mp3');
bgm.loop=true;bgm.volume=0.45;
function bgmPlay(){bgm.paused&&bgm.play().catch(()=>{});}
function bgmPause(){bgm.pause();}

// 游戏开始/恢复时播放，暂停/结束时停止
const _initGame=initGame;
initGame=function(){_initGame();bgmPlay();};
const _resumeGame=resumeGame;
resumeGame=function(){_resumeGame();bgmPlay();};
const _pauseGame=pauseGame;
pauseGame=function(){_pauseGame();bgmPause();};
const _onGameOver=onGameOver;
onGameOver=function(){_onGameOver();bgmPause();};

// 首次用户交互后启动（浏览器自动播放限制）
document.addEventListener('pointerdown',bgmPlay,{once:true});

loadImages(()=>{
  if(IMGS.scoreBox) document.getElementById('score-bg-img').src=IMGS.scoreBox.src;
  if(IMGS.goalToast) document.getElementById('goal-float-img').src=IMGS.goalToast.src;
  if(!player){show('register-screen');}else{initGame();}
});
</script>
